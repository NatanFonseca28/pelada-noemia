# Noemia Cup - Pelada de quarta (ambiente de desenvolvimento)
name: noemia-cup-pelada-de-quarta

x-labels: &labels
  com.noemiacup.project: "Noemia Cup - Pelada de quarta"

services:
  db:
    image: postgres:16-alpine
    container_name: noemia-cup-db
    labels: *labels
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    image: noemia-cup/api:dev
    container_name: noemia-cup-api
    labels: *labels
    env_file: .env
    environment:
      WATCHFILES_FORCE_POLLING: "true"  # bind mount do Windows/WSL não propaga eventos de arquivo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - media:/app/media
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build: ./frontend
    image: noemia-cup/web:dev
    container_name: noemia-cup-web
    labels: *labels
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Chatbot de cobrança: ponte não oficial com o WhatsApp (só sobe com --profile chatbot)
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: noemia-cup-evolution
    labels: *labels
    profiles: ["chatbot"]
    environment:
      SERVER_URL: http://localhost:8081
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-dev-evolution-key}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: pelada_dev
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      DEL_INSTANCE: "false"
      LOG_LEVEL: ERROR,WARN
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"

volumes:
  pgdata:
  media:
