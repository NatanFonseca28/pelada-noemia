# O plano gratuito do Render desliga a API após 15 min sem acesso (a volta leva ~1 min).
# Este agendamento chama /api/health a cada 10 min para mantê-la acordada.
name: Manter API acordada

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://pelada-api-9vwk.onrender.com/api/health
